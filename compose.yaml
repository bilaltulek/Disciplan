services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      # Local Compose uses HTTP. Vercel production keeps the secure-cookie default.
      COOKIE_SECURE: "false"
      PORT: 5000
      CORS_ORIGINS: http://localhost:8080
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/ || exit 1"]

  agent-worker:
    profiles: ["agents"]
    build:
      context: .
      dockerfile: Dockerfile.agent-worker
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      AGENT_WORKER_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
